ESSOA');$('loginTitle').textContent=mode==='master'?'Acesso do responsável':'Meu compartilhamento';$('loginText').textContent=mode==='master'?'Entre com a conta Mestre da família.':'Entre com sua conta. Localização, câmera e microfone ficam sob seu controle.';if(mode==='pessoa')document.body.classList.add('person');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),rel=t=>{if(!t)return'—';let s=Math.max(0,Math.floor((Date.now()-new Date(t))/1000));return s<60?`há ${s}s`:s<3600?`há ${Math.floor(s/60)} min`:`há ${Math.floor(s/3600)} h`},ini=n=>(n||'?').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase(),msg=t=>{let e=$('msg');if(e)e.textContent=t||''};async function family(){let{data,error}=await sb.rpc('get_my_family_settings');if(error)throw error;fam=data?.[0]||null;if(mode==='master'&&fam?.my_role!=='owner')throw Error('Esta conta não é Mestre.');if(mode==='pessoa'&&fam?.my_role==='owner')throw Error('Use o link Mestre para esta conta.')}function initMap(){if(map)return;map=L.map('map').setView([-3.73,-38.53],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}function clearMarks(){marks.forEach(m=>map.removeLayer(m));marks=[]}function draw(fit=false){if(!map)return;clearMarks();let pts=[];devices.forEach(d=>{if(Number.isFinite(d.latitude)&&Number.isFinite(d.longitude)){let m=L.marker([d.latitude,d.longitude]).addTo(map).bindPopup(`<b>${esc(d.display_name||'Membro')}</b>`);m.on('click',()=>select(d.device_id));marks.push(m);pts.push([d.latitude,d.longitude])}});if(sel&&Number.isFinite(sel.latitude)&&!fit)map.setView([sel.latitude,sel.longitude],17);else if(pts.length)map.fitBounds(pts,{padding:[30,30],maxZoom:17})}async function masterLoad(){let{data,error}=await sb.rpc('get_master_device_dashboard');if(error)throw error;devices=data||[];if(!sel||!devices.some(d=>d.device_id===sel.device_id))sel=devices[0]||null;renderMaster();draw(!sel)}function select(id){sel=devices.find(d=>d.device_id===id)||devices[0];renderMaster();draw(false)}function renderMaster(){let d=sel;$('app').innerHTML=`<header class="top"><div><div class="k">FAMÍLIA 360 · MESTRE</div><h1>${esc(fam?.family_name||'Família')}</h1><div class="muted">${devices.filter(x=>x.is_online).length} online · ${devices.length} aparelho(s)</div></div></header><div id="chips" class="chips">${devices.map(x=>`<button class="chip" data-id="${x.device_id}"><b>${esc(x.display_name||'Membro')}</b><div class="muted">${x.is_online?'Online':rel(x.last_seen_at)}</div></button>`).join('')}</div><div id="map" class="map"></div><section class="card sheet">${d?`<div class="personrow"><div class="avatar">${ini(d.display_name)}</div><div><h2 style="margin:0">${esc(d.display_name||'Membro')}</h2><div class="muted">${esc(d.device_name||'Aparelho')} · ${esc(d.platform||'—')}</div></div><span class="status ${d.is_online?'on':''}">${d.is_online?'Online':'Sem contato'}</span></div><div class="stats"><div class="stat"><strong>${d.battery_level==null?'—':d.battery_level+'%'}</strong><span>${d.battery_charging?'Carregando':'Bateria'}</span></div><div class="stat"><strong>${Number.isFinite(d.accuracy)?Math.round(d.accuracy)+' m':'—'}</strong><span>GPS</span></div><div class="stat"><strong>${rel(d.last_seen_at)}</strong><span>Último contato</span></div></div><div class="actions"><button id="focus" class="primary">⌾ Focar</button><button id="route">↗ Rota</button><button id="att">🔔 Alerta</button></div><div class="actions2"><button id="photo">📷 Solicitar foto</button><button id="audio">🎙️ Solicitar áudio</button></div><div class="actions2"><button id="media">🖼️ Mídia</button><button id="pair">🔗 Código</button></div><div id="msg" class="msg"></div><div class="detail"><div class="row"><span>📍 Localização</span><b>${d.location_permission==='granted'?'Autorizada':d.location_permission||'—'}</b></div><div class="row"><span>📷 Câmera</span><b>${d.camera_permission==='granted'?'Autorizada':d.camera_permission||'—'}</b></div><div class="row"><span>🎙️ Microfone</span><b>${d.microphone_permission==='granted'?'Autorizado':d.microphone_permission||'—'}</b></div></div>`:'Nenhum aparelho vinculado.'}</section><section class="card"><h3>⚠️ Emergência</h3><div id="events" class="muted">Carregando…</div></section>`;initMap();document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>select(b.dataset.id));if(!d)return;focus.onclick=()=>draw(false);route.onclick=()=>Number.isFinite(d.latitude)&&(location.href=`https://www.google.com/maps/dir/?api=1&destination=${d.latitude},${d.longitude}`);att.onclick=()=>request('attention');photo.onclick=()=>request('photo');audio.onclick=()=>request('audio');media.onclick=showMedia;pair.onclick=pairCode;loadEvents()}async function request(t){if(!sel)return;let{error}=await sb.rpc('create_device_request',{p_device_id:sel.device_id,p_request_type:t});msg(error?error.message:'Solicitação enviada.')}async function pairCode(){let{data,error}=await sb.rpc('create_device_pairing_code');if(error)return msg(error.message);msg(`Código: ${data?.code||'—'} · válido por 30 min.`)}async function loadEvents(){let{data}=await sb.rpc('get_master_emergency_events',{p_limit:20});let e=$('events');if(e)e.innerHTML=(data||[]).map(x=>`<div class="row"><span>${esc(x.display_name||'Membro')} · ${esc(x.message||x.event_type)}</span><small>${rel(x.created_at)}</small></div>`).join('')||'Nenhum evento.'}async function showMedia(){let{data,error}=await sb.from('device_media_items').select('media_type,content_type,data_base64,created_at').eq('device_id',sel.device_id).order('created_at',{ascending:false}).limit(12);if(error)return msg(error.message);$('modalBox').innerHTML=`<div class="top"><h2>Mídia</h2><button id="close">Fechar</button></div><div class="media">${(data||[]).map(m=>m.media_type==='photo'?`<p><img src="data:${m.content_type};base64,${m.data_base64}"><br><small>${rel(m.created_at)}</small></p>`:`<p><audio controls src="data:${m.content_type};base64,${m.data_base64}"></audio><br><small>${rel(m.created_at)}</small></p>`).join('')||'Nenhuma mídia.'}</div>`;$('modal').classList.remove('hidden');close.onclick=()=>modal.classList.add('hidden')}async function recover(){let{data,error}=await sb.from('user_devices').select('*').eq('user_id',user.id).is('revoked_at',null).order('paired_at',{ascending:false,nullsFirst:false}).order('updated_at',{ascending:false}).limit(10);if(error)throw error;dev=(data||[]).find(x=>x.paired_at)||data?.[0]||null;if(dev)deviceKey=dev.device_key;else{deviceKey=crypto.randomUUID();let r=await sb.rpc('register_my_device',{p_device_key:deviceKey,p_device_name:'Celular Android',p_platform:/Android/i.test(navigator.userAgent)?'Android':'Web',p_browser:/Chrome/i.test(navigator.userAgent)?'Chrome':'Navegador',p_app_version:'3.4-pages',p_install_mode:'web'});if(r.error)throw r.error;let q=await sb.from('user_devices').select('*').eq('user_id',user.id).eq('device_key',deviceKey).single();dev=q.data}}async function initBattery(){if(!navigator.getBattery)return;try{battery=await navigator.getBattery();let sync=()=>{batt=Math.round(battery.level*100);charging=battery.charging;personRender();heartbeat()};sync();battery.addEventListener('levelchange',sync);battery.addEventListener('chargingchange',sync)}catch{}}async function heartbeat(){if(!deviceKey)return;await sb.rpc('heartbeat_my_device',{p_device_key:deviceKey,p_battery_level:batt,p_battery_charging:charging});if(dev){dev.last_seen_at=new Date().toISOString();if(batt!=null)dev.battery_level=batt;personRender()}}async function personRender(){let p=(await sb.rpc('get_my_profile')).data?.[0];$('app').innerHTML=`<header class="top"><div><div class="k">FAMÍLIA 360 · PESSOA</div><h1>${esc(p?.display_name||'Minha segurança')}</h1><div class="muted">${esc(fam?.family_name||'Ainda não vinculada')}</div></div></header>${!dev?.paired_at?`<section class="card"><h2>Vincular ao Mestre</h2><div class="stack"><input id="pairIn" class="code" placeholder="CÓDIGO"><button id="pairBtn" class="primary">Vincular aparelho</button><div id="msg" class="msg"></div></div></section>`:''}<section class="card"><div class="personrow"><div class="avatar">${ini(p?.display_name)}</div><div><b>${esc(dev?.device_name||'Celular Android')}</b><div class="muted">Último contato ${rel(dev?.last_seen_at)}</div></div></div><div class="stats"><div class="stat"><strong>${batt!=null?batt+'%':dev?.battery_level!=null?dev.battery_level+'%':'—'}</strong><span>${(charging??dev?.battery_charging)?'Carregando':'Bateria'}</span></div><div class="stat"><strong id="gps">—</strong><span>GPS</span></div><div class="stat"><strong>${dev?.paired_at?'Vinculado':'Pendente'}</strong><span>Estado</span></div></div><div class="switch"><div><b>📍 Compartilhar localização</b><div class="muted">Você pode pausar quando quiser.</div></div><input id="share" type="checkbox" ${dev?.location_sharing_enabled?'checked':''}></div><div id="msg" class="msg"></div></section><section class="card"><h2>Permissões</h2><div class="row"><span>📷 Câmera</span><button id="cam">Autorizar</button></div><div class="row"><span>🎙️ Microfone</span><button id="mic">Autorizar</button></div><div class="row"><span>🔔 Notificações</span><button id="noti">Autorizar</button></div></section><section class="card"><h2>Solicitações do Mestre</h2><div id="reqs" class="muted">Carregando…</div></section><section class="card"><button id="sos" class="danger" style="width:100%">🆘 Enviar SOS</button></section>`;if($('pairBtn'))pairBtn.onclick=pairDevice;$('share').onchange=()=>share.checked?startLoc():stopLoc();cam.onclick=()=>allow('camera');mic.onclick=()=>allow('microphone');noti.onclick=()=>allow('notifications');sos.onclick=async()=>{let{error}=await sb.rpc('create_sos_alert');msg(error?error.message:'SOS enviado ao Mestre.')};loadRequests()}async function pairDevice(){let c=pairIn.value.trim();let{error}=await sb.rpc('pair_my_device',{p_code:c,p_device_key:deviceKey,p_device_name:'Celular Android',p_platform:'Android',p_browser:'Chrome',p_app_version:'3.4-pages',p_install_mode:'web'});if(error)return msg(error.message);await family();await recover();personRender()}async function savePerms(l,c,m,n){await sb.rpc('update_my_device_permissions',{p_device_key:deviceKey,p_location:l||dev?.location_permission||'unknown',p_camera:c||dev?.camera_permission||'unknown',p_microphone:m||dev?.microphone_permission||'unknown',p_notifications:n||dev?.notification_permission||'unknown'})}async function allow(k){try{if(k==='camera'){let s=await navigator.mediaDevices.getUserMedia({video:true});s.getTracks().forEach(t=>t.stop());await savePerms(null,'granted')}else if(k==='microphone'){let s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());await savePerms(null,null,'granted')}else{let r=await Notification.requestPermission();await savePerms(null,null,null,r)}}catch{msg('Permissão não concedida.')}}function sendPos(p){if($('gps'))gps.textContent=Math.round(p.coords.accuracy)+' m';sb.rpc('upsert_my_device_location',{p_device_key:deviceKey,p_latitude:p.coords.latitude,p_longitude:p.coords.longitude,p_accuracy:p.coords.accuracy,p_heading:p.coords.heading,p_speed:p.coords.speed,p_altitude:p.coords.altitude,p_battery_level:batt,p_battery_charging:charging})}function startLoc(){navigator.geolocation.getCurrentPosition(async p=>{let r=await sb.rpc('set_my_device_location_sharing',{p_device_key:deviceKey,p_enabled:true});if(r.error)return msg(r.error.message);dev.location_sharing_enabled=true;sendPos(p);watchId=navigator.geolocation.watchPosition(sendPos,e=>msg(e.message),{enableHighAccuracy:true,maximumAge:10000,timeout:20000})},e=>{share.checked=false;msg('Localização não autorizada.')},{enableHighAccuracy:true,timeout:20000})}async function stopLoc(){if(watchId!=null)navigator.geolocation.clearWatch(watchId);watchId=null;await sb.rpc('set_my_device_location_sharing',{p_device_key:deviceKey,p_enabled:false});dev.location_sharing_enabled=false;personRender()}async function loadRequests(){let{data}=await sb.rpc('get_my_pending_device_requests');if(!$('reqs'))return;reqs.innerHTML=(data||[]).map(r=>`<div class="request"><h3>${r.request_type==='photo'?'📷 Foto':r.request_type==='audio'?'🎙️ Áudio':'🔔 Alerta'}</h3><button class="primary acc" data-id="${r.id}" data-t="${r.request_type}">Aceitar</button> <button class="dec" data-id="${r.id}">Recusar</button></div>`).join('')||'Nenhuma solicitação pendente.';document.querySelectorAll('.dec').forEach(b=>b.onclick=async()=>{await sb.rpc('dismiss_device_request',{p_request_id:b.dataset.id});loadRequests()});document.querySelectorAll('.acc').forEach(b=>b.onclick=()=>accept(b.dataset.id,b.dataset.t))}async function accept(id,t){currentReq=id;if(t==='attention'){await sb.rpc('respond_device_alert_request',{p_request_id:id,p_status:'acknowledged'});return loadRequests()}if(t==='photo')return photoCapture();if(t==='audio')return audioCapture()}async function photoCapture(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});$('modalBox').innerHTML='<h2>Foto solicitada</h2><p>A câmera está visível. Só a foto tirada agora será enviada.</p><video id="video" class="preview" autoplay playsinline></video><div class="actions2"><button id="snap" class="primary">Tirar e enviar</button><button id="cancel">Cancelar</button></div>';modal.classList.remove('hidden');video.srcObject=stream;snap.onclick=async()=>{let c=document.createElement('canvas'),v=video;c.width=Math.min(v.videoWidth||640,720);c.height=Math.round((v.videoHeight||800)*(c.width/(v.videoWidth||640)));c.getContext('2d').drawImage(v,0,0,c.width,c.height);let data=c.toDataURL('image/jpeg',.65).split(',')[1];let{error}=await sb.rpc('submit_device_media',{p_request_id:currentReq,p_media_type:'photo',p_content_type:'image/jpeg',p_data_base64:data,p_duration_ms:null});stream.getTracks().forEach(t=>t.stop());modal.classList.add('hidden');msg(error?error.message:'Foto enviada.');loadRequests()};cancel.onclick=()=>{stream.getTracks().forEach(t=>t.stop());modal.classList.add('hidden')}}catch{msg('Não foi possível abrir a câmera.')}}async function audioCapture(){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=async()=>{let blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'}),buf=new Uint8Array(await blob.arrayBuffer()),bin='';for(let i=0;i<buf.length;i+=32768)bin+=String.fromCharCode(...buf.slice(i,i+32768));let{error}=await sb.rpc('submit_device_media',{p_request_id:currentReq,p_media_type:'audio',p_content_type:blob.type,p_data_base64:btoa(bin),p_duration_ms:10000});stream.getTracks().forEach(t=>t.stop());modal.classList.add('hidden');msg(error?error.message:'Áudio enviado.');loadRequests()};$('modalBox').innerHTML='<h2>Áudio solicitado</h2><p>A gravação começa somente quando você tocar abaixo.</p><button id="startA" class="primary">Gravar 10 segundos</button><button id="cancel">Cancelar</button>';modal.classList.remove('hidden');startA.onclick=()=>{rec.start();startA.disabled=true;setTimeout(()=>rec.state!=='inactive'&&rec.stop(),10000)};cancel.onclick=()=>{stream.getTracks().forEach(t=>t.stop());modal.classList.add('hidden')}}catch{msg('Não foi possível abrir o microfone.')}}async function start(){let g=await sb.auth.getUser();user=g.data.user;if(!user)return;await family();$('login').classList.add('hidden');$('app').classList.remove('hidden');$('bottom').classList.remove('hidden');if(mode==='master'){renderMaster();await masterLoad();setInterval(()=>masterLoad().catch(()=>{}),15000)}else{await recover();await initBattery();await personRender();await heartbeat();setInterval(heartbeat,30000);setInterval(loadRequests,10000)}}$('loginForm').onsubmit=async e=>{e.preventDefault();loginMsg.textContent='Entrando…';let{error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)return loginMsg.textContent=error.message;try{await start()}catch(e){loginMsg.textContent=e.message;await sb.auth.signOut()}};b1.onclick=()=>scrollTo({top:0,behavior:'smooth'});b2.onclick=()=>mode==='master'?masterLoad():personRender();b3.onclick=async()=>{await sb.auth.signOut();location.reload()};let s=(await sb.auth.getSession()).data.session;if(s)start().catch(async e=>{await sb.auth.signOut();loginMsg.textContent=e.message});</script></body></html>
