<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071a24"><title>Família 360 · Mestre</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="../icons/master.svg" type="image/svg+xml"><meta name="application-name" content="Família 360 Mestre"><meta name="mobile-web-app-capable" content="yes"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--bg:#061722;--card:#0c2a38;--card2:#0a2230;--line:#204656;--txt:#f6fbff;--muted:#91aebb;--mint:#43e0bf;--blue:#55bdf2;--warn:#ffc857;--danger:#ff6577}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#073044,#061722 45%);color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px 16px 96px}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.k{font-size:12px;letter-spacing:.15em;color:var(--mint);font-weight:900}.top h1{margin:3px 0 0;font-size:34px}.muted{color:var(--muted)}button,input{font:inherit}button{border:1px solid var(--line);background:#113646;color:var(--txt);border-radius:14px;padding:11px 14px;font-weight:800}button.primary{background:linear-gradient(135deg,#38c9ec,#34e2b2);color:#06202a;border:0}button.danger{background:#4b1e28;border-color:#783344;color:#ffdce1}.login{min-height:90vh;display:grid;place-items:center}.login-card,.card{background:rgba(10,39,52,.97);border:1px solid var(--line);border-radius:24px;box-shadow:0 16px 50px #0005}.login-card{width:min(430px,100%);padding:24px}.login-card h1{margin:4px 0 18px}.stack{display:grid;gap:12px}.stack label{font-size:13px;font-weight:800}.stack input{width:100%;margin-top:6px;background:#071b25;border:1px solid var(--line);color:#fff;padding:13px;border-radius:12px}.msg{min-height:20px;color:var(--warn);font-size:13px}.summary{display:flex;gap:12px;overflow:auto;padding:4px 0 14px}.member-chip{min-width:220px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#0b2b39;border-radius:20px;padding:11px}.avatar{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#42bff1,#38dfb5);color:#07303b;font-weight:950}.member-chip b{display:block}.member-chip small{color:var(--muted)}.mapbox{height:52vh;min-height:390px;border-radius:24px;overflow:hidden;border:1px solid var(--line);position:relative;background:#0b2532}.map-controls{position:absolute;z-index:500;top:12px;left:12px;display:flex;gap:6px}.sheet{position:relative;margin:-46px 10px 16px;padding:18px;background:rgba(9,40,54,.98);border:1px solid var(--line);border-radius:28px;z-index:600;box-shadow:0 20px 50px #0007}.person{display:flex;align-items:center;gap:13px}.person .avatar{width:66px;height:66px;border-radius:20px;font-size:22px}.person h2{margin:0;font-size:27px}.status{margin-left:auto;padding:7px 10px;border-radius:999px;background:#123c4d;color:#bad0d9;font-weight:900;font-size:12px}.status.on{background:#123c34;color:#6ff0c7}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.stat{background:#081f2b;border:1px solid var(--line);border-radius:17px;padding:12px}.stat strong{font-size:21px;display:block}.stat span{font-size:11px;color:var(--muted)}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.actions button{min-height:54px}.actions2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.detail{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}.detail-row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid #183b49}.detail-row span:first-child{color:var(--muted)}.card{padding:18px;margin:14px 0}.card h3{margin:0 0 12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.event{padding:10px 0;border-bottom:1px solid var(--line)}.event b{display:block}.event small{color:var(--muted)}.modal{position:fixed;inset:0;background:#0009;z-index:2000;display:grid;place-items:center;padding:18px}.modalbox{width:min(560px,100%);max-height:85vh;overflow:auto;background:#0b2a38;border:1px solid var(--line);border-radius:22px;padding:18px}.media-item{margin:12px 0;padding:10px;background:#071e29;border-radius:15px}.media-item img{max-width:100%;border-radius:12px}.media-item audio{width:100%}.bottom{position:fixed;left:0;right:0;bottom:0;background:#061722eF;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:1500}.bottom-inner{max-width:900px;margin:auto;display:flex;justify-content:space-between;gap:8px}.bottom button{flex:1;font-size:12px;padding:10px 6px}.leaflet-control-attribution{font-size:9px!important}.leaflet-container{background:#dfe8ec}@media(max-width:560px){.top h1{font-size:29px}.stats{grid-template-columns:repeat(3,1fr)}.stat strong{font-size:18px}.actions{grid-template-columns:repeat(3,1fr)}.actions button{font-size:12px}.person h2{font-size:23px}.sheet{margin-top:-32px}.mapbox{height:49vh}}
</style></head><body><main class="wrap"><section id="login" class="login"><div class="login-card"><div class="k">FAMÍLIA 360 · MESTRE</div><h1>Acesso do responsável</h1><form id="loginForm" class="stack"><label>E-mail<input id="email" type="email" required autocomplete="email"></label><label>Senha<input id="password" type="password" required autocomplete="current-password"></label><button class="primary">Entrar</button><div id="loginMsg" class="msg"></div></form></div></section><section id="app" class="hidden"><header class="top"><div><div class="k">FAMÍLIA 360 · MESTRE</div><h1 id="familyName">Família</h1><div id="onlineSummary" class="muted">Carregando…</div></div><button id="logout">Sair</button></header><div id="chips" class="summary"></div><div class="mapbox"><div id="map" style="height:100%"></div><div class="map-controls"><button id="fit">Todos</button><button id="refresh">↻</button></div></div><section id="sheet" class="sheet"><div class="person"><div id="avatar" class="avatar">--</div><div><h2 id="personName">Selecione</h2><div id="deviceMeta" class="muted">Nenhum aparelho</div></div><div id="status" class="status">—</div></div><div class="stats"><div class="stat"><strong id="battery">—</strong><span id="charging">Bateria</span></div><div class="stat"><strong id="accuracy">—</strong><span>Precisão GPS</span></div><div class="stat"><strong id="lastSeen">—</strong><span>Último contato</span></div></div><div class="actions"><button class="primary" id="focus">⌾ Focar</button><button id="route">↗ Rota</button><button id="attention">🔔 Alerta</button></div><div class="actions2"><button id="photo">📷 Solicitar foto</button><button id="audio">🎙️ Solicitar áudio</button></div><div class="actions2"><button id="media">🖼️ Mídia recebida</button><button id="pairCode">🔗 Gerar código</button></div><div id="pairResult" class="msg"></div><div id="details" class="detail"></div></section><section class="card"><h3>⚠️ Emergência</h3><div class="toolbar"><button id="reloadEvents">Atualizar eventos</button></div><div id="events" class="muted" style="margin-top:10px">Nenhum evento.</div></section></section></main><div id="mediaModal" class="modal hidden"><div class="modalbox"><div class="top"><h3 id="mediaTitle">Mídia</h3><button id="closeMedia">Fechar</button></div><div id="mediaList"></div></div></div><div class="bottom hidden" id="bottom"><div class="bottom-inner"><button id="bottomMap" class="primary">Mapa</button><button id="bottomEmergency">Emergência</button><button id="bottomPair">Vínculo</button></div></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/+esm';import L from 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/+esm';
const sb=createClient('https://kevillefdybgadutiypo.supabase.co','sb_publishable_Bpx1O-662JPP4uH0bDHS9g_ymXISucW',{auth:{persistSession:true,autoRefreshToken:true}});const $=id=>document.getElementById(id);let family=null,devices=[],selected=null,map=null,layers=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const rel=t=>{if(!t)return '—';const s=Math.max(0,Math.floor((Date.now()-new Date(t).getTime())/1000));if(s<60)return `há ${s}s`;if(s<3600)return `há ${Math.floor(s/60)} min`;if(s<86400)return `há ${Math.floor(s/3600)} h`;return new Date(t).toLocaleDateString('pt-BR')};const initials=n=>(n||'?').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
function msg(t){$('pairResult').textContent=t||'';setTimeout(()=>$('pairResult').textContent='',6000)}
function initMap(){if(map)return;map=L.map('map',{zoomControl:true}).setView([-3.73,-38.53],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}
function renderMap(fit=false){initMap();layers.forEach(x=>map.removeLayer(x));layers=[];const pts=[];for(const d of devices){if(Number.isFinite(d.latitude)&&Number.isFinite(d.longitude)){const m=L.marker([d.latitude,d.longitude]).addTo(map).bindPopup(`<b>${esc(d.display_name||'Membro')}</b><br>${esc(d.device_name||'Aparelho')}`);m.on('click',()=>selectDevice(d.device_id));layers.push(m);pts.push([d.latitude,d.longitude])}}if(selected&&Number.isFinite(selected.latitude)&&Number.isFinite(selected.longitude)&&!fit)map.setView([selected.latitude,selected.longitude],17);else if(pts.length)map.fitBounds(pts,{padding:[30,30],maxZoom:17})}
function selectDevice(id){selected=devices.find(d=>d.device_id===id)||devices[0]||null;renderUI();renderMap(false)}
function renderUI(){const d=selected;$('chips').innerHTML=devices.map(x=>`<button class="member-chip" data-id="${x.device_id}"><div class="avatar">${initials(x.display_name)}</div><div><b>${esc(x.display_name||'Membro')}</b><small>${x.is_online?'Online':rel(x.last_seen_at)}</small></div></button>`).join('');document.querySelectorAll('.member-chip').forEach(b=>b.onclick=()=>selectDevice(b.dataset.id));$('onlineSummary').textContent=`${devices.filter(x=>x.is_online).length} online • ${devices.length} aparelho${devices.length===1?'':'s'} vinculado${devices.length===1?'':'s'}`;if(!d){$('personName').textContent='Nenhum aparelho';$('deviceMeta').textContent='Gere um código e vincule o aparelho da pessoa.';return}$('avatar').textContent=initials(d.display_name);$('personName').textContent=d.display_name||'Membro';$('deviceMeta').textContent=`${d.device_name||'Aparelho'} • ${d.platform||'—'}`;$('status').textContent=d.is_online?'Online':'Sem contato';$('status').className='status '+(d.is_online?'on':'');$('battery').textContent=d.battery_level==null?'—':`${d.battery_level}%`;$('charging').textContent=d.battery_level==null?'Bateria indisponível':(d.battery_charging?'Carregando':'Descarregando');$('accuracy').textContent=Number.isFinite(d.accuracy)?`${Math.round(d.accuracy)} m`:'—';$('lastSeen').textContent=rel(d.last_seen_at);const perm=(v)=>v==='granted'?'Autorizada':v==='denied'?'Negada':'Não informada';$('details').innerHTML=`<div class="detail-row"><span>📍 Localização</span><b>${perm(d.location_permission)}</b></div><div class="detail-row"><span>📷 Câmera</span><b>${perm(d.camera_permission)}</b></div><div class="detail-row"><span>🎙️ Microfone</span><b>${perm(d.microphone_permission)}</b></div><div class="detail-row"><span>🔔 Notificações</span><b>${perm(d.notification_permission)}</b></div><div class="detail-row"><span>🌐 Navegador</span><b>${esc(d.browser||'—')}</b></div>`}
async function load(){const {data:f,error:fe}=await sb.rpc('get_my_family_settings');if(fe)throw fe;family=f?.[0]||null;if(!family||family.my_role!=='owner')throw new Error('Esta conta não é o Mestre da família.');$('familyName').textContent=family.family_name||'Família';const {data,error}=await sb.rpc('get_master_device_dashboard');if(error)throw error;devices=data||[];if(!selected||!devices.some(x=>x.device_id===selected.device_id))selected=devices[0]||null;renderUI();renderMap(!selected);await loadEvents()}
async function loadEvents(){const {data,error}=await sb.rpc('get_master_emergency_events',{p_limit:30});if(error){$('events').textContent='Não foi possível carregar eventos.';return}$('events').innerHTML=(data||[]).length?(data||[]).map(e=>`<div class="event"><b>${esc(e.display_name||'Membro')} · ${esc(e.event_type)}</b><div>${esc(e.message||'')}</div><small>${new Date(e.created_at).toLocaleString('pt-BR')}</small></div>`).join(''):'Nenhum evento de emergência.'}
async function request(type){if(!selected)return msg('Selecione um aparelho.');const {error}=await sb.rpc('create_device_request',{p_device_id:selected.device_id,p_request_type:type});msg(error?error.message:(type==='photo'?'Solicitação de foto enviada.':type==='audio'?'Solicitação de áudio enviada.':'Alerta enviado.'))}
async function openMedia(){if(!selected)return msg('Selecione um aparelho.');$('mediaTitle').textContent=`Mídia de ${selected.display_name||'membro'}`;$('mediaModal').classList.remove('hidden');const {data,error}=await sb.from('device_media_items').select('id,media_type,content_type,data_base64,duration_ms,created_at').eq('device_id',selected.device_id).order('created_at',{ascending:false}).limit(20);if(error){$('mediaList').textContent=error.message;return}$('mediaList').innerHTML=(data||[]).length?(data||[]).map(m=>m.media_type==='photo'?`<div class="media-item"><img src="data:${esc(m.content_type)};base64,${m.data_base64}" alt="Foto enviada"><small>${new Date(m.created_at).toLocaleString('pt-BR')}</small></div>`:`<div class="media-item"><audio controls src="data:${esc(m.content_type)};base64,${m.data_base64}"></audio><small>${new Date(m.created_at).toLocaleString('pt-BR')}</small></div>`).join(''):'Nenhuma mídia recebida.'}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='Entrando…';const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return $('loginMsg').textContent=error.message;try{await start()}catch(err){$('loginMsg').textContent=err.message;await sb.auth.signOut()}};async function start(){const {data:{user}}=await sb.auth.getUser();if(!user)return;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('bottom').classList.remove('hidden');initMap();await load();setInterval(()=>load().catch(()=>{}),15000)}
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('refresh').onclick=()=>load().catch(e=>msg(e.message));$('fit').onclick=()=>renderMap(true);$('focus').onclick=()=>renderMap(false);$('route').onclick=()=>{if(!selected||!Number.isFinite(selected.latitude))return msg('Sem posição disponível.');location.href=`https://www.google.com/maps/dir/?api=1&destination=${selected.latitude},${selected.longitude}`};$('attention').onclick=()=>request('attention');$('photo').onclick=()=>request('photo');$('audio').onclick=()=>request('audio');$('media').onclick=openMedia;$('closeMedia').onclick=()=>$('mediaModal').classList.add('hidden');$('pairCode').onclick=async()=>{let result;if(selected){result=await sb.rpc('create_device_pairing_code_for_device',{p_device_id:selected.device_id});}else{result=await sb.rpc('create_device_pairing_code');}const {data,error}=result;if(error)return msg(error.message);const code=data?.code||'—';msg(`Código: ${code} — válido por 30 min. Envie este código para a pessoa.`);try{await navigator.clipboard.writeText(code)}catch{}};$('reloadEvents').onclick=loadEvents;$('bottomEmergency').onclick=()=>$('events').scrollIntoView({behavior:'smooth'});$('bottomPair').onclick=()=>$('pairCode').click();$('bottomMap').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
const {data:{session}}=await sb.auth.getSession();if(session)start().catch(async e=>{await sb.auth.signOut();$('loginMsg').textContent=e.message;location.reload()});
</script></body></html>
