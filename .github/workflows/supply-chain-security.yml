name: Supply Chain Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 6 * * 1'

permissions:
  contents: read

jobs:
  secret-pattern-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan current tree for high-confidence secret patterns
        shell: python
        run: |
          import pathlib, re, sys

          patterns = {
              "private_key": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "github_token": re.compile(r"gh[pousr]_[A-Za-z0-9_]{20,}"),
              "google_api_key": re.compile(r"AIza[0-9A-Za-z_-]{30,}"),
              "aws_access_key": re.compile(r"AKIA[0-9A-Z]{16}"),
          }
          ignored = {".git", "node_modules", "test-results"}
          findings = []
          for path in pathlib.Path(".").rglob("*"):
              if not path.is_file() or any(part in ignored for part in path.parts):
                  continue
              if path.stat().st_size > 2_000_000:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except Exception:
                  continue
              for kind, rx in patterns.items():
                  for m in rx.finditer(text):
                      line = text.count("\n", 0, m.start()) + 1
                      findings.append((kind, str(path), line))
          for kind, path, line in findings:
              print(f"SECRET_PATTERN type={kind} path={path} line={line}")
          if findings:
              raise SystemExit(1)
          print("SECRET_PATTERN_SCAN=pass")

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build ephemeral lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit dependencies
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json','utf8'));
          const v = report.metadata?.vulnerabilities || {};
          console.log('NPM_AUDIT=' + JSON.stringify(v));
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) process.exit(1);
          NODE
